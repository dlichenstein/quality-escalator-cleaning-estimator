appId: com.qualitycleaning.escalator-estimator
productName: Quality Escalator Cleaning Estimator
artifactName: Quality-Escalator-Cleaning-Estimator-${version}-${os}-${arch}.${ext}
directories:
  output: dist
files:
  - index.html
  - manifest.webmanifest
  - sw.js
  - icon-192.png
  - icon-512.png
  - electron/**
win:
  target:
    - nsis
    - portable
  icon: icon-512.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  target: dmg
linux:
  target: AppImage
